name: Gateway checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: gateway-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host-tests:
    # CommonCrypto host adapters need macOS; avoid the constrained ARM pool.
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tools/test.sh
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==2026.10.1
      - run: esphome config firmware/esp32.yaml
      - run: esphome config firmware/esp32-test.yaml
      - run: esphome compile firmware/esp32.yaml
